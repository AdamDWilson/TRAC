name: Publish production (deploy branch)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate templates
        run: python3 template-letters/validate_templates.py

      - name: Build dist/
        env:
          BUILD_ENV: production
        run: ./build.sh

      - name: Publish dist/ to deploy branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          commit_message: "Deploy ${{ github.ref_name }} (${{ github.sha }})"
